{% extends "base.html" %}{% block c %}
<p><a href="/profesor">← Mis materias</a></p><h1>{{ m.nombre }}</h1>
<section class="card"><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<div class="scroll"><table><thead><tr><th>Estudiante</th><th>Usuario</th><th>Calificación (0–10)</th></tr></thead><tbody>
{% for a in alumnos %}<tr><td>{{ a.nombre }}</td><td>{{ a.usuario }}</td>
<td><input class="nota-in" name="n_{{ a.id }}" inputmode="decimal" value="{{ '' if a.calificacion is none else a.calificacion }}" aria-label="Calificación de {{ a.nombre }}"></td></tr>{% endfor %}
</tbody></table></div><button>Guardar cambios</button></form></section>{% endblock %}
